name: release

# Push a tag like v0.1.0 to publish:
#   1. GitHub Release with binaries for Windows, macOS and Linux (+ checksums)
#   2. npm packages, so "npx packmyrepo" works
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  github:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - run: go test ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    npm:
    needs: github
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub proves to npm that this workflow is the publisher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Trusted publishing needs npm 11.5.1 or newer
      - run: npm install -g npm@latest
      - run: npm --version
      - run: node npm/build.mjs "${GITHUB_REF_NAME}" --publish